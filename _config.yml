title: Eternia Solutions LLC - Software Architecture & API Development
email: office@eterniasolutions.io
description: >-
  Independent software architecture and development, specializing in API design,
  system architecture, PHP, Node.js, PostgreSQL, MySQL, NoSQL, and network engineering.
  One accountable engineer, working with clients in the US and Europe.
baseurl: ""
url: "https://eterniasolutions.io"
author: "Simo Jakovic"
keywords: "software architecture, API development, API design, backend development, PHP development, Node.js development, PostgreSQL, MySQL, NoSQL, database engineering, system integration, enterprise software, network engineering, software consulting"

# Social media
social:
  linkedin: "https://www.linkedin.com/company/eternia-solutions"

twitter:
  username: eterniasolutions
  card: summary_large_image

# SEO
google_analytics: # Add your GA tracking ID here
google_verification: # Add your Google verification code here

# Site settings
timezone: Europe/Belgrade
lang: en_US

# Jekyll settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Simo Jakovic"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md 