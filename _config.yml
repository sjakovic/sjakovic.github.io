title: Eternia Solutions LLC - Software Development & IT Services
email: office@eterniasolutions.io
description: >-
  Eternia Solutions LLC is a small software development and IT services company
  registered in Wyoming, USA. API development, backend systems, database engineering,
  and system integration for clients in the US and Europe.
baseurl: ""
url: "https://eterniasolutions.io"
author: "Eternia Solutions LLC"
keywords: "software architecture, API development, API design, backend development, PHP development, Node.js development, PostgreSQL, MySQL, NoSQL, database engineering, system integration, enterprise software, network engineering, software consulting"

# SEO
google_analytics: # Add your GA tracking ID here
google_verification: # Add your Google verification code here

# Site settings
timezone: America/Denver
lang: en_US

# Jekyll settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Eternia Solutions LLC"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md 